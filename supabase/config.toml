# OpenAI (required for process-audio-note):
#   supabase secrets set OPENAI_API_KEY=sk-... --project-ref <your-project-ref>
# Or: Supabase Dashboard → Project Settings → Edge Functions → Secrets.
#
# Deploy this function:
#   supabase functions deploy process-audio-note --project-ref <your-project-ref>
#
# Local: `supabase link` then `supabase secrets set OPENAI_API_KEY=...` and
# `supabase functions serve process-audio-note`

# Gateway JWT check can return 401 for projects on new JWT signing keys (ES256) while
# the legacy verify_jwt path still expects old tokens. This function already validates
# Authorization with supabase.auth.getUser(jwt) — safe to skip gateway verification.
# Redeploy after change: supabase functions deploy process-audio-note
[functions.process-audio-note]
verify_jwt = false

# Living thesis: apply a processed debrief onto the account thesis.
# Custom JWT validation inside the function (same ES256 gateway caveat).
[functions.apply-debrief-to-thesis]
verify_jwt = false

# GAU-94: Iterative plan refinement. Custom JWT validation inside the function.
[functions.refine-plan]
verify_jwt = false

# GAU-95: Plan version history (list, detail, restore). Custom JWT validation.
[functions.plan-versions]
verify_jwt = false

# RevenueCat → Supabase bridge. RevenueCat cannot send a Supabase JWT, so the
# gateway check is disabled; the function authenticates with a shared secret
# (REVENUECAT_WEBHOOK_AUTH) sent in the Authorization header.
# Secrets to set:
#   supabase secrets set REVENUECAT_WEBHOOK_AUTH=<random-string>
#   supabase secrets set REVENUECAT_REST_API_KEY=<rcat-secret-key>   # sk_… (v1 REST)
# Configure the same REVENUECAT_WEBHOOK_AUTH value in RevenueCat dashboard →
# Integrations → Webhooks → Authorization header.
[functions.revenuecat-webhook]
verify_jwt = false

# In-app account deletion (App Store Guideline 5.1.1(v)). The caller's JWT is
# validated inside the function (verify_jwt disabled for parity with the
# others, avoiding the ES256 gateway 401 noted above).
[functions.delete-account]
verify_jwt = false
