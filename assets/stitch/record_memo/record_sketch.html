<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Voice Memo - Record</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#140f54",
                        "surface-container-highest": "#dfe2ea",
                        "on-tertiary-container": "#ffd2be",
                        "on-surface-variant": "#464555",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e5e8f0",
                        "primary": "#3525cd",
                        "surface": "#f8f9ff",
                        "on-secondary-fixed-variant": "#413f82",
                        "tertiary": "#7e3000",
                        "on-background": "#181c21",
                        "surface-tint": "#4d44e3",
                        "primary-fixed-dim": "#c3c0ff",
                        "outline-variant": "#c7c4d8",
                        "tertiary-container": "#a44100",
                        "surface-variant": "#dfe2ea",
                        "secondary-fixed": "#e2dfff",
                        "secondary": "#58579b",
                        "background": "#f8f9ff",
                        "surface-container-low": "#f0f4fb",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-error": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "surface-dim": "#d7dae2",
                        "secondary-fixed-dim": "#c3c0ff",
                        "on-surface": "#181c21",
                        "on-secondary": "#ffffff",
                        "outline": "#777587",
                        "on-secondary-container": "#454386",
                        "inverse-primary": "#c3c0ff",
                        "primary-container": "#4f46e5",
                        "tertiary-fixed-dim": "#ffb695",
                        "tertiary-fixed": "#ffdbcc",
                        "surface-bright": "#f8f9ff",
                        "inverse-surface": "#2c3137",
                        "on-primary-fixed": "#0f0069",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#dad7ff",
                        "on-tertiary-fixed": "#351000",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eef1f9",
                        "surface-container": "#ebeef6",
                        "secondary-container": "#b6b4ff"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .waveform-bar {
            transition: height 0.2s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Section -->
<header class="w-full top-0 sticky z-40 bg-[#f8f9ff] dark:bg-slate-950 flex items-center justify-between px-6 py-4 transition-colors">
<div class="flex items-center gap-4">
<button class="text-indigo-600 dark:text-indigo-400 active:scale-95 duration-200 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-extrabold text-lg tracking-tight text-indigo-600 dark:text-indigo-400">Voice Memo</h1>
</div>
<div class="flex items-center gap-2">
<span class="text-on-surface-variant font-semibold text-sm">New Note</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pb-32">
<!-- Background Organic Shape Decor -->
<div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
<div class="absolute top-[10%] -left-[10%] w-[80vw] h-[80vw] rounded-full bg-surface-container-high opacity-20 blur-3xl"></div>
<div class="absolute bottom-[20%] -right-[10%] w-[60vw] h-[60vw] rounded-full bg-primary-container opacity-5 blur-3xl"></div>
</div>
<!-- Recording Timer & Header -->
<div class="text-center space-y-4 mb-12">
<h2 class="text-display-md font-extrabold text-on-surface text-5xl tracking-tighter">00:00</h2>
<p class="text-on-surface-variant font-medium tracking-wide uppercase text-xs">Ready to capture</p>
</div>
<!-- Visual Waveform Visualization -->
<div class="w-full max-w-sm h-32 flex items-center justify-center gap-1.5 mb-20">
<!-- Simulated Waveform Bars -->
<div class="waveform-bar w-1.5 h-4 bg-primary/20 rounded-full"></div>
<div class="waveform-bar w-1.5 h-8 bg-primary/30 rounded-full"></div>
<div class="waveform-bar w-1.5 h-12 bg-primary/40 rounded-full"></div>
<div class="waveform-bar w-1.5 h-16 bg-primary/60 rounded-full"></div>
<div class="waveform-bar w-1.5 h-12 bg-primary/40 rounded-full"></div>
<div class="waveform-bar w-1.5 h-20 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-14 bg-primary/50 rounded-full"></div>
<div class="waveform-bar w-1.5 h-24 bg-primary rounded-full"></div>
<div class="waveform-bar w-1.5 h-16 bg-primary/60 rounded-full"></div>
<div class="waveform-bar w-1.5 h-10 bg-primary/30 rounded-full"></div>
<div class="waveform-bar w-1.5 h-6 bg-primary/20 rounded-full"></div>
</div>
<!-- Primary Recording Control -->
<div class="relative group">
<!-- Pulse Effect Layers -->
<div class="absolute inset-0 bg-primary/10 rounded-full scale-150 blur-xl animate-pulse"></div>
<div class="absolute inset-0 bg-primary/5 rounded-full scale-[2] blur-2xl"></div>
<!-- Main Button -->
<button class="relative z-10 w-32 h-32 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-[0px_20px_40px_rgba(79,70,229,0.2)] active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-white text-5xl" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Secondary Meta Information -->
<div class="mt-20 w-full max-w-md">
<div class="bg-surface-container-lowest rounded-xl p-6 flex items-center gap-4 transition-transform hover:-rotate-1 cursor-pointer">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="auto_awesome">auto_awesome</span>
</div>
<div class="flex-1">
<h3 class="font-bold text-on-surface">Auto-Transcription</h3>
<p class="text-sm text-on-surface-variant">Enabled: English (US)</p>
</div>
<div class="w-10 h-6 bg-primary rounded-full flex items-center px-1">
<div class="w-4 h-4 bg-white rounded-full translate-x-4"></div>
</div>
</div>
<div class="mt-4 flex gap-3 justify-center">
<span class="px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container text-xs font-bold uppercase tracking-wider">Strategy</span>
<span class="px-4 py-2 rounded-full bg-tertiary-fixed text-on-tertiary-fixed text-xs font-bold uppercase tracking-wider">New Project</span>
</div>
</div>
</main>
<!-- BottomNavBar Section -->
<nav class="fixed bottom-6 left-0 right-0 z-50 flex justify-around items-center px-4">
<div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md rounded-[3rem] shadow-[0px_20px_40px_rgba(79,70,229,0.06)] flex justify-around items-center py-2">
<!-- Mic Tab (Active) -->
<a class="bg-gradient-to-br from-indigo-600 to-indigo-500 text-white rounded-full p-4 scale-110 -translate-y-2 shadow-lg shadow-indigo-200 dark:shadow-indigo-900/20 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</a>
<!-- List Tab -->
<a class="text-slate-400 dark:text-slate-500 p-4 hover:text-indigo-500 transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="list">list</span>
</a>
<!-- Settings Tab -->
<a class="text-slate-400 dark:text-slate-500 p-4 hover:text-indigo-500 transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</a>
</div>
</nav>
</body></html>
